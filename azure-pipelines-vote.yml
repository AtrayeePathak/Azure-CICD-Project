 # Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  paths:
    include:
      - vote/*

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '575a6a72-ab98-4b2f-8817-21685b8a6322'
  imageRepository: 'votingapp'
  containerRegistry: 'atrayeeazurecicd.azurecr.io'
  tag: '$(Build.BuildId)'

pool:
  name: 'azureagent'

stages:
- stage: Build
  displayName: Build 
  jobs:
  - job: Build
    displayName: Build the image
    steps:
    - task: Docker@2
      displayName: Build the image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'build'
        Dockerfile: 'vote/Dockerfile'
        tags: '$(tag)'

- stage: Push
  displayName: Push 
  jobs:
  - job: Push
    displayName: Push the image
    steps:
    - task: Docker@2
      displayName: Push the image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'push'
        tags: '$(tag)'

- stage: Update
  displayName: Update 
  jobs:
  - job: Update
    displayName: Update
    steps:
    # 1. NEW FIX: Strip Windows line endings before running the script
    - task: Bash@3
      displayName: 'Fix Windows Line Endings'
      inputs:
        targetType: 'inline'
        script: 'sed -i "s/\r$//" Scripts/updatek8smanifests.sh'
        
    # 2. Run the shell script
    - task: ShellScript@2
      inputs:
        scriptPath: 'Scripts/updatek8smanifests.sh'
        args: 'vote $(imageRepository) $(tag)'